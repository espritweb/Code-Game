<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Esprit — Codebreaker</title>
  <style>
    :root{--ink:#f7f3eb;--muted:#b7b5bd;--panel:#191c25;--line:#3a4050;--accent:#f0c24d;--empty:#303542}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#293557 0,transparent 38rem),#0c0e13;color:var(--ink);font:16px/1.4 system-ui,sans-serif}
    main{width:min(100% - 2rem,780px);margin:auto;padding:clamp(1.5rem,5vw,4rem) 0} header{display:flex;justify-content:space-between;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1.3rem}
    h1{margin:0;font-size:clamp(2.4rem,8vw,4.5rem);letter-spacing:-.07em}h1 span{color:var(--accent)}.subtitle,.rules,#message{color:var(--muted);margin:.2rem 0 0}
    .card{background:#191c25ee;border:1px solid var(--line);border-radius:18px;padding:clamp(1rem,3vw,1.5rem);box-shadow:0 16px 45px #0008}
    .toolbar,.palette-header,.bottom{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}.levels,.actions,.game-controls{display:flex;gap:.45rem;flex-wrap:wrap}
    button{cursor:pointer;border:1px solid #4a5160;border-radius:9px;min-height:2.4rem;padding:.42rem .72rem;color:var(--ink);background:#292f3b;font:inherit}button:hover:not(:disabled),button:focus-visible{border-color:var(--accent);outline:2px solid transparent;background:#343b49}button:disabled{opacity:.45;cursor:not-allowed}button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#191409;font-weight:700}
    .stats,.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0;color:var(--muted);font-size:.88rem}.legend{width:max-content;max-width:100%;flex-wrap:nowrap;margin:1rem 0;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:#11141b;white-space:nowrap}.key{display:inline-flex;gap:.35rem;align-items:center}.feedback{display:grid;grid-template-columns:repeat(2,.55rem);gap:.18rem;width:1.3rem}.feedback i{width:.55rem;height:.55rem;border-radius:50%;background:#4b5260}.feedback i.exact{background:#57c76c}.feedback i.partial{background:#d9dde2}
    .level-picker{margin-bottom:1rem;border:1px solid var(--line);border-radius:12px;background:#11141b}.level-picker summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:.7rem .85rem;font-weight:700}.level-picker summary span:last-child{font-size:.8rem;font-weight:400;color:var(--muted)}.level-picker .levels{padding:0 .85rem .85rem}.palette-area{margin:1rem 0;padding:1rem;border:1px solid var(--line);border-radius:14px;background:#11141b}.palette-header{margin-bottom:.7rem}.game-controls{margin-bottom:.85rem}.game-controls #check{background:var(--accent);border-color:var(--accent);color:#191409;font-weight:700}.palette{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}.colour{width:2.55rem;min-height:2.55rem;padding:0;border-radius:50%;position:relative;touch-action:none;background:var(--colour);border-color:color-mix(in srgb,var(--colour) 70%,white);box-shadow:inset -4px -5px 9px #0007,inset 4px 4px 8px #fff4}.colour:hover:not(:disabled),.colour:focus-visible{background:var(--colour);filter:brightness(1.18)}.colour.numbered{color:#fff;font-size:1rem;font-weight:800;text-shadow:0 1px 3px #000}.colour::after{content:attr(aria-label);position:absolute;top:calc(100% + .25rem);left:50%;transform:translateX(-50%);padding:.1rem .3rem;border-radius:4px;background:#090b10;color:var(--ink);font-size:.66rem;opacity:0;pointer-events:none;white-space:nowrap}.colour:hover::after,.colour:focus-visible::after{opacity:1}.number-toggle{margin-left:auto;white-space:nowrap}
    .board{display:grid;gap:.3rem;max-height:23rem;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:.25rem;margin:1.2rem 0}.row{display:grid;grid-template-columns:2rem minmax(0,1fr) 1.5rem;gap:.75rem;align-items:center;min-height:2.45rem;padding:.3rem .25rem;border-radius:10px}.row.active{background:#272d3a;outline:1px solid #464f61}.row-number{text-align:right;color:#8d94a3;font-size:.8rem}.pegs{display:grid;grid-template-columns:repeat(4,minmax(2.2rem,1fr));gap:.25rem}.peg{max-width:2.45rem;width:100%;aspect-ratio:1;justify-self:center;border-radius:50%;background:var(--empty);border:2px solid #505866;box-shadow:inset 0 2px 6px #0008}.peg.filled{background:var(--colour);border-color:color-mix(in srgb,var(--colour) 70%,white);box-shadow:inset -4px -5px 9px #0007,inset 4px 4px 8px #fff4}.peg.numbered{display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 1px 3px #000}.peg.drop-target{cursor:copy}.peg.drop-target:hover{border-color:var(--accent)}.peg.movable{cursor:grab}.moving-source{opacity:.3}.drag-ghost{position:fixed;z-index:20;pointer-events:none;margin:0;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
    #message{min-height:1.5em}.win{color:#a9edb4!important}.lose{color:#ffaaa7!important}dialog{max-width:min(90vw,420px);background:#1d212b;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:1.5rem;box-shadow:0 25px 70px #000b}dialog::backdrop{background:#000a}dialog h2{margin-top:0}
    @media(max-width:480px){main{width:min(100% - 1rem,780px)}.row{grid-template-columns:1.4rem 1fr 1.3rem;gap:.35rem}.pegs{gap:.25rem}.game-controls{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.game-controls button{min-width:0;padding:.42rem .3rem;font-size:.8rem}.game-controls #check{grid-column:span 2}.number-toggle{margin-left:0}.legend{display:grid;width:100%;max-width:none;grid-template-columns:1fr;gap:.4rem;white-space:normal;font-size:.8rem}.legend .key{min-width:0}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>Esprit <span>🔒</span></h1><p class="subtitle">A classic code-breaking puzzle, remastered.</p></div><p class="subtitle" id="attempts" aria-live="polite"></p></header>
    <section class="card">
      <details class="level-picker" id="level-picker"><summary><span id="current-level">Level 1</span><span>Change level</span></summary><div class="levels" role="group" aria-label="Difficulty"><button data-level="1">Level 1</button><button data-level="2">Level 2</button><button data-level="3">Level 3</button><button data-level="4">Level 4</button></div></details>
      <p class="rules" id="rules"></p><p class="stats" id="stats" aria-live="polite"></p>
      <div class="palette-area"><div class="palette-header"><strong>Choose or drag a colour onto the highlighted row</strong></div><div class="game-controls"><button id="check" disabled>Check guess</button><button id="undo">Undo</button><button id="reveal">Reveal</button><button id="new-game">New game</button><button id="pop-out">Pop out</button></div><div class="palette" id="palette" aria-label="Available colours"></div></div>
      <div class="legend"><span class="key"><span class="feedback"><i class="exact"></i></span>right colour, right position</span><span class="key"><span class="feedback"><i class="partial"></i></span>right colour, wrong position</span></div>
      <div class="board" id="board" aria-label="Guess board"></div><p id="message" role="status"></p><div class="bottom"><strong>Fill all four slots, then check your guess</strong></div>
    </section>
  </main>
  <dialog id="result"><h2 id="result-title"></h2><p id="result-copy"></p><div class="pegs" id="solution"></div><form method="dialog"><button autofocus>Play again</button></form></dialog>
  <script>
    const colours=[['Red','#e95050'],['Yellow','#efc84a'],['Blue','#3c7eea'],['Green','#52b36a'],['Brown','#8a5a40'],['Cyan','#38b9c7'],['Purple','#9665d7'],['Orange','#ed873e'],['Forest','#246b4d']];
    const levels={1:{count:7,repeats:false,label:'7 colours · no repeated colours'},2:{count:7,repeats:true,label:'7 colours · repeated colours allowed'},3:{count:9,repeats:false,label:'9 colours · no repeated colours'},4:{count:9,repeats:true,label:'9 colours · repeated colours allowed'}};
    const $=s=>document.querySelector(s),board=$('#board'),palette=$('#palette'),message=$('#message');
    let level=1,secret=[],guesses=[],current=[],over=false,drag=null,suppressClick=false;
    const statsKey='esprit-mastermind-stats-v1',numberKey='esprit-mastermind-show-numbers';
    let showNumbers=localStorage.getItem(numberKey)==='true'; let stats={};try{stats=JSON.parse(localStorage.getItem(statsKey))||{}}catch{}
    const state=()=>{if(!stats[level])stats[level]={wins:0,losses:0,best:null};return stats[level]}; const save=()=>localStorage.setItem(statsKey,JSON.stringify(stats));
    const filled=()=>current.filter(v=>v!==undefined).length;
    function randomCode(){const pool=Array.from({length:levels[level].count},(_,i)=>i);return levels[level].repeats?Array.from({length:4},()=>pool[Math.floor(Math.random()*pool.length)]):pool.sort(()=>Math.random()-.5).slice(0,4)}
    function score(guess){let exact=0,s=[],g=[];guess.forEach((v,i)=>v===secret[i]?exact++:(s.push(secret[i]),g.push(v)));let partial=0;g.forEach(v=>{const i=s.indexOf(v);if(i>-1){partial++;s.splice(i,1)}});return{exact,partial}}
    function peg(colour){const el=document.createElement('span');el.className=`peg${colour!==undefined?' filled':''}${colour!==undefined&&showNumbers?' numbered':''}`;if(colour!==undefined){el.style.setProperty('--colour',colours[colour][1]);el.title=colours[colour][0];if(showNumbers)el.textContent=colour+1}return el}
    function setMessage(text,type=''){message.textContent=text;message.className=type}
    function makeGhost(source,event){const ghost=source.cloneNode(false),rect=source.getBoundingClientRect();ghost.classList.add('drag-ghost');ghost.style.width=`${rect.width}px`;ghost.style.height=`${rect.height}px`;document.body.append(ghost);moveGhost(event);return ghost}
    function moveGhost(event){if(drag?.ghost){drag.ghost.style.left=`${event.clientX}px`;drag.ghost.style.top=`${event.clientY}px`}}
    function clearDrag(){if(!drag)return;drag.ghost?.remove();drag.source?.classList.remove('moving-source');drag=null}
    function render(){const rule=levels[level],record=state();$('#rules').textContent=`${rule.label}. Crack the four-colour code in 16 attempts.`;$('#attempts').textContent=`${16-guesses.length} attempts left`;$('#stats').textContent=`Level ${level} record: ${record.wins} won · ${record.losses} lost · Best: ${record.best?record.best+' guesses':'—'}`;$('#current-level').textContent=`Level ${level}`;document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.level===String(level)));
      board.replaceChildren();for(let row=0;row<16;row++){const entry=guesses[row]||(row===guesses.length?current:[]),line=document.createElement('div');line.className=`row${row===guesses.length&&!over?' active':''}`;line.innerHTML=`<span class="row-number">${String(row+1).padStart(2,'0')}</span>`;const pegs=document.createElement('div');pegs.className='pegs';for(let i=0;i<4;i++){const item=peg(entry[i]);if(row===guesses.length&&!over){item.classList.add('drop-target');item.dataset.slot=i;item.addEventListener('dragover',e=>e.preventDefault());if(entry[i]!==undefined){item.classList.add('movable');item.addEventListener('pointerdown',e=>beginPegDrag(e,i,item));item.addEventListener('pointermove',movePegDrag);item.addEventListener('pointerup',finishPegDrag);item.addEventListener('pointercancel',clearDrag)}}pegs.append(item)}const marks=document.createElement('span');marks.className='feedback';if(guesses[row]){const r=score(guesses[row]);for(let i=0;i<r.exact;i++)marks.append(Object.assign(document.createElement('i'),{className:'exact'}));for(let i=0;i<r.partial;i++)marks.append(Object.assign(document.createElement('i'),{className:'partial'}))}line.append(pegs,marks);board.append(line)}
      palette.replaceChildren();colours.slice(0,rule.count).forEach((item,index)=>{const button=document.createElement('button');button.className=`colour${showNumbers?' numbered':''}`;button.style.setProperty('--colour',item[1]);button.setAttribute('aria-label',item[0]);button.disabled=over;if(showNumbers)button.textContent=index+1;button.addEventListener('pointerdown',e=>beginColourDrag(e,index,button));button.addEventListener('pointermove',moveColourDrag);button.addEventListener('pointerup',finishColourDrag);button.addEventListener('pointercancel',clearDrag);button.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}pick(index)});palette.append(button)});const toggle=document.createElement('button');toggle.className='number-toggle';toggle.setAttribute('role','switch');toggle.setAttribute('aria-checked',String(showNumbers));toggle.textContent=showNumbers?'Hide numbers':'Show numbers';toggle.addEventListener('click',()=>{showNumbers=!showNumbers;localStorage.setItem(numberKey,String(showNumbers));render()});palette.append(toggle);$('#undo').disabled=over||filled()===0;$('#reveal').disabled=over;$('#check').disabled=over||filled()!==4;if(guesses.length>=8)board.scrollTop=board.scrollHeight}
    function beginColourDrag(e,colour,source){if(e.button!==0||over)return;drag={kind:'colour',colour,source,startX:e.clientX,startY:e.clientY,moved:false};source.classList.add('moving-source');drag.ghost=makeGhost(source,e);source.setPointerCapture(e.pointerId)}
    function moveColourDrag(e){if(!drag||drag.kind!=='colour')return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>6)drag.moved=true;moveGhost(e)}
    function finishColourDrag(e){if(!drag||drag.kind!=='colour')return;const d=drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.drop-target'),slot=target?Number(target.dataset.slot):NaN;clearDrag();if(d.moved){suppressClick=true;if(Number.isInteger(slot))place(d.colour,slot)}}
    function beginPegDrag(e,from,source){if(e.button!==0||over)return;drag={kind:'peg',from,source};source.classList.add('moving-source');drag.ghost=makeGhost(source,e);source.setPointerCapture(e.pointerId)}
    function movePegDrag(e){if(drag?.kind==='peg')moveGhost(e)}
    function finishPegDrag(e){if(!drag||drag.kind!=='peg')return;const from=drag.from,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.drop-target'),slot=target?Number(target.dataset.slot):NaN;clearDrag();if(Number.isInteger(slot))movePeg(from,slot)}
    function pick(colour){const slot=current.findIndex(v=>v===undefined);place(colour,slot===-1?current.length:slot)}
    function place(colour,slot){if(over||slot<0||slot>3)return;if(!levels[level].repeats&&current.some((v,i)=>v===colour&&i!==slot)){setMessage('This level does not allow a repeated colour.','lose');return}current[slot]=colour;setMessage('');render()}
    function movePeg(from,to){if(over||from===to||current[from]===undefined)return;const held=current[from],target=current[to];current[to]=held;if(target===undefined)delete current[from];else current[from]=target;setMessage('');render()}
    function undo(){for(let i=3;i>=0;i--)if(current[i]!==undefined){delete current[i];break}setMessage('');render()}
    function check(){if(over||filled()!==4)return;const result=score(current);guesses.push([...current]);current=[];if(result.exact===4)return finish(true);if(guesses.length===16)return finish(false);setMessage(`${result.exact} exact, ${result.partial} correct colour${result.partial===1?'':'s'} in another position.`);render()}
    function finish(won){if(over)return;over=true;const record=state();if(won){record.wins++;if(record.best===null||guesses.length<record.best)record.best=guesses.length}else record.losses++;save();render();setMessage(won?'You cracked the code!':'Game over.',won?'win':'lose');$('#result-title').textContent=won?'You win!':'Game over';$('#result-copy').textContent=won?`Solved in ${guesses.length} guess${guesses.length===1?'':'es'}.`:'The secret code was:';$('#solution').replaceChildren(...secret.map(peg));$('#result').showModal()}
    function start(next=level){level=next;secret=randomCode();guesses=[];current=[];over=false;setMessage('');if($('#result').open)$('#result').close();render()}
    document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{start(Number(b.dataset.level));$('#level-picker').open=false}));$('#undo').addEventListener('click',undo);$('#reveal').addEventListener('click',()=>finish(false));$('#new-game').addEventListener('click',()=>start());$('#check').addEventListener('click',check);$('#pop-out').addEventListener('click',()=>{const game=window.open(location.href,'espritGame','popup=yes,width=820,height=800,toolbar=no,menubar=no,location=no,status=no,resizable=yes,scrollbars=yes');if(!game)setMessage('Your browser blocked the pop-out window. Allow pop-ups for this game and try again.','lose')});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&filled()===4&&!over)check()});$('#result').addEventListener('close',()=>{if(over)start()});start();
  </script>
</body>
</html>
